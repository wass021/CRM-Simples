<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>CRM - Dashboard</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <h1>Dashboard</h1>
  <div>
    <button onclick="location.href='./contacts.html'">Contatos</button>
    <button onclick="logout()">Sair</button>
  </div>
</header>
<div class="container">
  <div class="dashboard-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem">
    <div class="card"><h3>Total de Contatos</h3><p id="contactsCount">...</p></div>
    <div class="card"><h3>Oportunidades</h3><p id="dealsCount">0</p></div>
    <div class="card"><h3>Tarefas</h3><p id="tasksCount">0</p></div>
  </div>
</div>
<script>
function logout(){ localStorage.removeItem('token'); location.href='/'; }
</script>
<script src="js/dashboard.js"></script>
</body>
</html>
